name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same compiler setup and flags as run-demo.ps1.
      - name: Build slowapp and waitwhy (MSVC x64)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ tools were not found on the runner" }
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null

          cl /nologo /EHsc /Od /Zi /std:c++17 slowapp.cpp /Fe:slowapp.exe
          if ($LASTEXITCODE -ne 0) { throw "slowapp.cpp did not compile" }
          cl /nologo /EHsc /O2 /Zi /std:c++17 waitwhy.cpp /Fe:waitwhy.exe
          if ($LASTEXITCODE -ne 0) { throw "waitwhy.cpp did not compile" }
