name: build

on:
  push:
    branches: ['**']   # tags go through release.yml, which runs this workflow first (W42)
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Same compiler setup and flags as run-demo.ps1.
      - name: Build slowapp and waitwhy (MSVC x64)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ tools were not found on the runner" }
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null

          cl /nologo /W4 /WX /EHsc /Od /Zi /std:c++17 slowapp.cpp /Fe:slowapp.exe
          if ($LASTEXITCODE -ne 0) { throw "slowapp.cpp did not compile" }
          cl /nologo /W4 /WX /EHsc /Od /Zi /std:c++17 scenarios.cpp /Fe:scenarios.exe
          if ($LASTEXITCODE -ne 0) { throw "scenarios.cpp did not compile" }
          # W46: control-flow guard, CET shadow stacks, ASLR with high entropy.
          cl /nologo /W4 /WX /EHsc /O2 /Zi /std:c++17 /guard:cf waitwhy.cpp /Fe:waitwhy.exe /link /DEBUG /guard:cf /CETCOMPAT /DYNAMICBASE /HIGHENTROPYVA
          if ($LASTEXITCODE -ne 0) { throw "waitwhy.cpp did not compile" }
          $headers = dumpbin /headers waitwhy.exe | Out-String
          if ($headers -notmatch 'Guard') { Write-Host $headers; throw "waitwhy.exe is not built with control-flow guard" }
          if ($headers -notmatch 'CET compatible') { Write-Host "::warning::dumpbin does not show waitwhy.exe as CET compatible." }
          if ($headers -notmatch 'High Entropy Virtual Addresses') { throw "waitwhy.exe has no high-entropy ASLR" }
          cl /nologo /W4 /WX /EHsc /O2 /std:c++17 tests\replay_events.cpp /Fe:replay_events.exe
          if ($LASTEXITCODE -ne 0) { throw "tests\replay_events.cpp did not compile" }
          cl /nologo /W4 /WX /EHsc /O2 /std:c++17 /DWAITWHY_NO_MAIN tests\decode_tests.cpp /Fe:decode_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests\decode_tests.cpp did not compile" }
          cl /nologo /W4 /WX /EHsc /O2 /std:c++17 tests\analysis_tests.cpp /Fe:analysis_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests\analysis_tests.cpp did not compile" }
          cl /nologo /W4 /WX /EHsc /O2 /std:c++17 tests\golden_tests.cpp /Fe:golden_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests\golden_tests.cpp did not compile" }

          # Same as run-demo.ps1: the SDK's dbghelp.dll and symsrv.dll beside waitwhy.exe (W27).
          $debuggers = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64'
          foreach ($dll in 'dbghelp.dll', 'symsrv.dll') {
            $source = Join-Path $debuggers $dll
            if (Test-Path $source) { Copy-Item $source -Destination . -Force }
            else { Write-Host "::warning::$source was not found; --symbols ms will not be tested." }
          }

      - name: Unit tests
        shell: pwsh
        run: |
          .\analysis_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests\analysis_tests.cpp failed" }
          .\golden_tests.exe tests\golden
          if ($LASTEXITCODE -ne 0) { throw "tests\golden_tests.cpp failed" }

      # Replays a recorded trace through the analysis core, and through waitwhy's ETW decoding;
      # needs no kernel trace.
      - name: Replay recorded trace
        shell: pwsh
        run: |
          .\replay_events.exe docs\traces\buggy-64mb-events.txt
          if ($LASTEXITCODE -ne 0) { throw "replaying docs\traces\buggy-64mb-events.txt failed" }
          .\decode_tests.exe docs\traces\buggy-64mb-events.txt
          if ($LASTEXITCODE -ne 0) { throw "decoding docs\traces\buggy-64mb-events.txt failed" }

      # W30: the command line, without a kernel trace. analyze on the golden dump must print the
      # golden report exactly.
      - name: Command line
        shell: pwsh
        run: |
          .\waitwhy.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version did not exit with 0" }
          .\waitwhy.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help did not exit with 0" }
          .\waitwhy.exe --no-such-option | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "an unknown option did not exit with 1" }
          .\waitwhy.exe --pid abc | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "a bad --pid did not exit with 1" }
          $out = & .\waitwhy.exe analyze tests\golden\slowapp-lock.events.txt 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "analyze failed" }
          $got = ($out.Substring($out.IndexOf('=====')) -replace "`r", '').TrimEnd()
          $want = ((Get-Content tests\golden\slowapp-lock.report.txt -Raw) -replace "`r", '').Trim()
          if ($got -ne $want) { Write-Host $out; throw "analyze does not print the golden report" }
          # W37: the exports are JSON in the layout each viewer reads.
          .\waitwhy.exe analyze tests\golden\slowapp-lock.events.txt --export-chrome golden-chrome.json --export-speedscope golden-speedscope.json | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "analyze with --export-chrome and --export-speedscope failed" }
          $chrome = Get-Content golden-chrome.json -Raw | ConvertFrom-Json
          if (-not ($chrome.traceEvents | Where-Object { $_.ph -eq 'X' -and $_.tid -eq 1 -and $_.name -like 'lock in *update_frame' })) {
            throw "the Chrome trace has no lock wait of main in update_frame"
          }
          $speedscope = Get-Content golden-speedscope.json -Raw | ConvertFrom-Json
          if ($speedscope.profiles.Count -lt 3 -or $speedscope.shared.frames.Count -lt 1) { throw "the speedscope profile is missing threads or frames" }
          # W36: the report as one HTML page.
          .\waitwhy.exe analyze tests\golden\slowapp-lock.events.txt --format html --out golden.html | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "analyze --format html failed" }
          $html = Get-Content golden.html -Raw
          if (-not $html.StartsWith('<!doctype html>') -or $html -notmatch 'waiting for a lock that another thread was holding, in slowapp!.*update_frame') {
            throw "the HTML report is not a page with main's lock finding"
          }

      # C8 smoke test: waitwhy must report the lock bug in buggy slowapp and nothing in fixed
      # slowapp. GitHub's Windows runners run as Administrator, which kernel tracing needs.
      - name: Smoke test (buggy and fixed slowapp)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Watch-Slowapp([string]$Label, [string[]]$SlowappArgs, [string[]]$WaitwhyArgs = @()) {
            $app = Start-Process -FilePath (Resolve-Path .\slowapp.exe) -PassThru -WindowStyle Hidden `
              -ArgumentList (@('--seconds', '20', '--mb', '64') + $SlowappArgs)
            Start-Sleep -Seconds 3
            $text = & .\waitwhy.exe --pid $app.Id --seconds 8 --dump-events "$Label-events.txt" @WaitwhyArgs 2>&1 | Out-String
            $code = $LASTEXITCODE
            Set-Content -Path "$Label-report.txt" -Value $text -Encoding utf8
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
            Write-Host "===== waitwhy on $Label slowapp (exit code $code) ====="
            Write-Host $text
            if ($code -eq 2) {
              Write-Host "::warning::Kernel tracing is not available on this runner (waitwhy exit code 2); the smoke test was skipped."
              exit 0
            }
            if ($code -ne 0) { throw "waitwhy failed on $Label slowapp with exit code $code" }
            return $text
          }

          # W31: another tool's "NT Kernel Logger" session must survive waitwhy's runs.
          logman start "NT Kernel Logger" -p "Windows Kernel Trace" "(process,thread)" -o other-tool.etl -ets | Out-Host
          $otherTool = $LASTEXITCODE -eq 0
          if (-not $otherTool) { Write-Host '::warning::Could not start an NT Kernel Logger session to check W31.' }

          $buggy = Watch-Slowapp 'buggy' @()
          $fixed = Watch-Slowapp 'fixed' @('--fixed')
          # W26: slowapp exits about 3 s into the 8 s watch; names must come from the trace.
          $exited = Watch-Slowapp 'exited' @('--seconds', '6')
          # W45: without stack snapshots the lock finding still stands, and the report says so.
          $nosuspend = Watch-Slowapp 'nosuspend' @() @('--no-suspend')
          # W32: launch mode: waitwhy starts slowapp itself and watches it from the start until it exits.
          $launch = & .\waitwhy.exe --seconds 12 --dump-events launch-events.txt -- .\slowapp.exe --seconds 6 --mb 64 2>&1 | Out-String
          Set-Content -Path launch-report.txt -Value $launch -Encoding utf8
          Write-Host "===== waitwhy launching slowapp (exit code $LASTEXITCODE) ====="
          Write-Host $launch
          # W27: with Microsoft's symbols, ntdll has full names.
          $symbols = $null
          if (Test-Path .\symsrv.dll) { $symbols = Watch-Slowapp 'symbols' @() @('--symbols', 'ms') }
          # W38: record the buggy slowapp into an .etl file, then report from the file alone.
          $app = Start-Process -FilePath (Resolve-Path .\slowapp.exe) -PassThru -WindowStyle Hidden `
            -ArgumentList @('--seconds', '20', '--mb', '64')
          Start-Sleep -Seconds 3
          $recorded = & .\waitwhy.exe record --pid $app.Id --seconds 8 --out buggy.etl 2>&1 | Out-String
          $recordCode = $LASTEXITCODE
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
          Write-Host "===== waitwhy record (exit code $recordCode) ====="
          Write-Host $recorded
          $fromEtl = & .\waitwhy.exe analyze buggy.etl 2>&1 | Out-String
          $fromEtlCode = $LASTEXITCODE
          Set-Content -Path etl-report.txt -Value $fromEtl -Encoding utf8
          Write-Host "===== waitwhy analyze buggy.etl (exit code $fromEtlCode) ====="
          Write-Host $fromEtl
          $fromEtlByName = & .\waitwhy.exe analyze buggy.etl --name slowapp.exe 2>&1 | Out-String
          $fromEtlByNameCode = $LASTEXITCODE
          # W39: flight recorder: keep the last 5 s, report when a named event is set.
          $app = Start-Process -FilePath (Resolve-Path .\slowapp.exe) -PassThru -WindowStyle Hidden `
            -ArgumentList @('--seconds', '30', '--mb', '64')
          Start-Sleep -Seconds 3
          $ringProc = Start-Process -FilePath (Resolve-Path .\waitwhy.exe) -PassThru -NoNewWindow `
            -RedirectStandardOutput ring-report.txt -RedirectStandardError ring-errors.txt `
            -ArgumentList @('record', '--ring', '5', '--trigger', 'Local\waitwhy-ci', '--out', 'ring.etl', '--pid', "$($app.Id)")
          $null = $ringProc.Handle  # keeps the exit code readable
          $trigger = $null
          for ($i = 0; $i -lt 50 -and -not $trigger; $i++) {
            Start-Sleep -Milliseconds 200
            $found = $null
            if ([System.Threading.EventWaitHandle]::TryOpenExisting('Local\waitwhy-ci', [ref]$found)) { $trigger = $found }
          }
          Start-Sleep -Seconds 9
          if ($trigger) { [void]$trigger.Set() }
          if (-not $ringProc.WaitForExit(180000)) { Stop-Process -Id $ringProc.Id -ErrorAction SilentlyContinue }
          $ringCode = $ringProc.ExitCode
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
          $ring = (Get-Content ring-report.txt -Raw) + (Get-Content ring-errors.txt -Raw)
          Write-Host "===== waitwhy record --ring 5 (exit code $ringCode) ====="
          Write-Host $ring

          # Function names can carry a namespace, e.g. slowapp!`anonymous namespace'::update_frame.
          # In the fixed run saver still waits on the disk, which is fine; only the lock must go.
          $failures = @()
          if ($buggy -notmatch '\(main\) spent \d+% of the time waiting for a lock that another thread was holding, in slowapp!.*update_frame\.') {
            $failures += 'Buggy run: main is not reported as blocked on a lock in update_frame.'
          }
          if ($buggy -notmatch 'The lock was released by Thread \d+ \(saver\)') {
            $failures += 'Buggy run: saver is not named as the thread that released the lock.'
          }
          if ($buggy -notmatch '\(saver\).* waiting for the disk, in slowapp!.*write_settings_to_disk\.') {
            $failures += 'Buggy run: saver is not reported as waiting for the disk in write_settings_to_disk.'
          }
          if ($fixed -match 'waiting for a lock that another thread was holding') {
            $failures += 'Fixed run: a thread is still reported as blocked on a lock.'
          }
          if ($exited -notmatch 'the program exited during the trace' -or $exited -notmatch 'slowapp!.*update_frame') {
            $failures += 'Exited run: function names were not found from the modules recorded in the trace.'
          }
          if ($otherTool) {
            logman query "NT Kernel Logger" -ets | Out-Null
            if ($LASTEXITCODE -ne 0) { $failures += "W31: waitwhy stopped another tool's NT Kernel Logger session." }
            logman stop "NT Kernel Logger" -ets | Out-Null
          }
          if ($buggy -match 'using the shared') { $failures += 'W31: waitwhy did not get a private trace session.' }

          # W34: the JSON report, parsed as a script would.
          $json = (& .\waitwhy.exe analyze buggy-events.txt --format json 2>$null | Out-String) | ConvertFrom-Json
          if ($json.schema -ne 'waitwhy-report/1' -or
              -not ($json.findings | Where-Object { $_.category -eq 'lock' -and $_.yourCode -match 'update_frame' -and $_.chain.waker -match 'saver' })) {
            $failures += 'JSON report: no lock finding in update_frame with a chain to saver.'
          }

          # W37: a real run's timeline as a Chrome trace and a speedscope profile.
          & .\waitwhy.exe analyze buggy-events.txt --export-chrome buggy-chrome.json --export-speedscope buggy-speedscope.json | Out-Null
          $chrome = Get-Content buggy-chrome.json -Raw | ConvertFrom-Json
          if (-not ($chrome.traceEvents | Where-Object { $_.ph -eq 'X' -and $_.name -like 'lock in *update_frame' })) {
            $failures += 'Chrome trace: no lock wait in update_frame in the buggy run.'
          }
          $speedscope = Get-Content buggy-speedscope.json -Raw | ConvertFrom-Json
          if (-not ($speedscope.shared.frames | Where-Object { $_.name -like '*update_frame*' })) {
            $failures += 'speedscope profile: no update_frame frame in the buggy run.'
          }

          # W36: the buggy run as an HTML page, kept with the dumps.
          & .\waitwhy.exe analyze buggy-events.txt --format html --out buggy.html | Out-Null
          if ((Get-Content buggy.html -Raw) -notmatch 'waiting for a lock that another thread was holding, in slowapp!.*update_frame') {
            $failures += 'HTML report: no lock finding in update_frame in the buggy run.'
          }

          # W35: diff as a CI gate. Going from the fixed to the buggy slowapp must fail it.
          & .\waitwhy.exe analyze buggy-events.txt --format json --out buggy.json | Out-Null
          & .\waitwhy.exe analyze fixed-events.txt --format json --out fixed.json | Out-Null
          & .\waitwhy.exe diff fixed.json buggy.json --fail-if-worse 10 | Out-Host
          if ($LASTEXITCODE -ne 3) { $failures += "diff: fixed -> buggy did not exit with 3 (got $LASTEXITCODE)." }
          # The other way the lock finding goes away. saver's disk share is the same activity in both
          # runs but varies by about 10 points between two live runs on a CI runner (+11 in run #93),
          # so this direction allows 30 points; the check above needs no margin, the finding is new.
          & .\waitwhy.exe diff buggy.json fixed.json --fail-if-worse 30 | Out-Host
          if ($LASTEXITCODE -ne 0) { $failures += "diff: buggy -> fixed did not exit with 0 (got $LASTEXITCODE)." }

          # W28: the program's file I/O is traced and its files named; saver's file shows as the object.
          $buggyDump = Get-Content buggy-events.txt -Raw
          $fileIoLines = ([regex]::Matches($buggyDump, '(?m)^FILEIO ')).Count
          Write-Host "Buggy dump: $fileIoLines FILEIO lines; FILENAME lines:"
          [regex]::Matches($buggyDump, '(?m)^FILENAME .*$') | ForEach-Object { Write-Host "  $($_.Value)" }
          if ($buggyDump -notmatch '(?m)^FILEIO ' -or $buggyDump -notmatch '(?m)^FILENAME .* kind=1 ') {
            $failures += 'Buggy run: no file I/O or no named file on a disk volume in the event dump.'
          }
          if ($buggy -notmatch 'Object     : [A-Za-z]:\\') {
            $failures += 'Buggy run: no wait row names the file it was writing.'
          }
          if ($buggyDump -notmatch '(?m)^FILENAME .* kind=3 ') {
            Write-Host '::warning::No console file object was named in the buggy run (W28).'
          }
          if ($launch -notmatch 'Started .*slowapp' -or $launch -notmatch '\(main(, exited)?\) spent \d+% of the time waiting for a lock that another thread was holding, in slowapp!.*update_frame\.') {
            $failures += 'Launch run: slowapp was not started and watched, or its lock wait was not found.'
          }
          if ($nosuspend -notmatch '\(main\) spent \d+% of the time waiting for a lock that another thread was holding, in slowapp!.*update_frame\.' -or
              $nosuspend -notmatch 'Stack snapshots  : not taken') {
            $failures += 'No-suspend run: no lock finding in update_frame, or no note that stack snapshots were not taken.'
          }
          if ($recordCode -ne 0 -or -not (Test-Path buggy.etl) -or -not (Test-Path buggy.etl.waitwhy)) {
            $failures += "Record run: waitwhy record exited with $recordCode or wrote no buggy.etl and buggy.etl.waitwhy."
          }
          if ($fromEtlCode -ne 0 -or
              $fromEtl -notmatch '\(main\) spent \d+% of the time waiting for a lock that another thread was holding, in slowapp!.*update_frame\.' -or
              $fromEtl -notmatch 'The lock was released by Thread \d+ \(saver\)') {
            $failures += 'Record run: the report from buggy.etl does not show the lock in update_frame released by saver.'
          }
          if ($fromEtlByNameCode -ne 0 -or $fromEtlByName -notmatch 'update_frame') {
            $failures += 'Record run: analyze buggy.etl --name slowapp.exe did not find the lock wait.'
          }
          if (-not $trigger -or $ringCode -ne 0 -or $ring -notmatch 'waitwhy-ci was set' -or
              $ring -notmatch 'watched for (4\.9\d|5\.0\d) s' -or
              $ring -notmatch '\(main\) spent \d+% of the time waiting for a lock that another thread was holding, in slowapp!.*update_frame\.') {
            $failures += "Flight recorder: the trigger did not end it with a report of the last 5 s showing main's lock wait (exit code $ringCode)."
          }
          if ($symbols -and $symbols -notmatch 'Function names   : full names in [^;\r\n]*ntdll') {
            $failures += 'Symbols run: ntdll has no full names with --symbols ms.'
          }

          # W19: the report rebuilt from each run's dump must equal the live report.
          function Get-ReportPart([string]$Text) {
            $i = $Text.IndexOf('=====')
            if ($i -lt 0) { return '' }
            return ($Text.Substring($i) -replace "`r", '').TrimEnd()
          }
          foreach ($run in @(@{ Label = 'buggy'; Live = $buggy }, @{ Label = 'fixed'; Live = $fixed },
                             @{ Label = 'exited'; Live = $exited }, @{ Label = 'symbols'; Live = $symbols },
                             @{ Label = 'launch'; Live = $launch }, @{ Label = 'nosuspend'; Live = $nosuspend })) {
            if (-not $run.Live) { continue }
            $offline = & .\waitwhy.exe --from-dump "$($run.Label)-events.txt" 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or (Get-ReportPart $offline) -ne (Get-ReportPart $run.Live)) {
              Write-Host "===== report rebuilt from $($run.Label)-events.txt ====="
              Write-Host $offline
              $failures += "$($run.Label) run: the report rebuilt from the dump differs from the live report."
            }
          }

          foreach ($f in $failures) { Write-Host "::error::$f" }
          if ($failures.Count -gt 0) { exit 1 }
          Write-Host 'C8 holds: the bug is reported in the buggy run and not in the fixed run.'

      # W29: one known waiting pattern per scenarios.exe mode, each with its expected finding.
      # Soft expectations depend on what Windows logs and only warn until confirmed.
      - name: Scenarios (known answers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cases = @(
            @{ Mode = 'condvar'; Hard = @('\(main\) spent \d+% of the time waiting for another thread or an event to signal it, in scenarios!.*wait_for_result') },
            @{ Mode = 'coldread'; Hard = @('\(main\) spent \d+% of the time waiting for the disk, in scenarios!.*read_cold_file') },
            @{ Mode = 'console'; Args = @('--min-ms', '0'); Not = @('waiting for the disk, in scenarios!.*print_lines');
               Soft = @('\(main\) spent \d+% of the time waiting for another thread or an event to signal it, in scenarios!.*print_lines',
                        'thread \d+ of conhost\.exe') },
            @{ Mode = 'pipe'; Hard = @('\(client\) spent \d+% of the time waiting for another thread or an event to signal it, in scenarios!.*pipe_round_trip') },
            @{ Mode = 'socket'; Hard = @('\(client\) spent \d+% of the time waiting for the network, in scenarios!.*socket_round_trip') },
            @{ Mode = 'cpu'; Hard = @('spent \d+% of the time ready to run but waiting for a free CPU') },
            @{ Mode = 'child'; Hard = @('\(main\) spent \d+% of the time waiting for another thread or an event to signal it, in scenarios!.*wait_for_child') },
            @{ Mode = 'child'; Args = @('--children'); Hard = @('and \d+ more process\(es\), watched for', '\[PID \d+\]') },
            @{ Mode = 'lockcpu'; Hard = @('So it holds the lock while it is running') },
            @{ Mode = 'locksleep'; Hard = @('So it holds the lock while it is sleeping on purpose') },
            @{ Mode = 'lockdisk'; Hard = @('So it holds the lock while it is waiting for the disk') },
            @{ Mode = 'sleep'; Hard = @('No thread lost a significant share of its time to blocking') }
          )
          $failures = @()
          foreach ($c in $cases) {
            $app = Start-Process -FilePath (Resolve-Path .\scenarios.exe) -PassThru -WindowStyle Hidden `
              -ArgumentList @('--mode', $c.Mode, '--seconds', '12')
            Start-Sleep -Seconds 3
            $wwArgs = @('--pid', $app.Id, '--seconds', '5') + @($c.Args | Where-Object { $_ })
            $text = & .\waitwhy.exe @wwArgs 2>&1 | Out-String
            $code = $LASTEXITCODE
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
            Write-Host "::group::scenario $($c.Mode) (exit code $code)"
            Write-Host $text
            Write-Host '::endgroup::'
            if ($code -eq 2) { Write-Host "::warning::Kernel tracing is not available; scenario $($c.Mode) skipped."; continue }
            if ($code -ne 0) { $failures += "$($c.Mode): waitwhy exited with code $code"; continue }
            foreach ($h in @($c.Hard | Where-Object { $_ })) {
              if ($text -notmatch $h) { $failures += "$($c.Mode): the report does not match /$h/" }
            }
            foreach ($n in @($c.Not | Where-Object { $_ })) {
              if ($text -match $n) { $failures += "$($c.Mode): the report should not match /$n/" }
            }
            foreach ($soft in @($c.Soft | Where-Object { $_ })) {
              if ($text -notmatch $soft) { Write-Host "::warning::$($c.Mode): the report does not match /$soft/ (not required yet)" }
            }
          }
          foreach ($f in $failures) { Write-Host "::error::$f" }
          if ($failures.Count -gt 0) { exit 1 }
          Write-Host 'All scenarios gave their expected findings.'

      # W43: how much watching and recording slow a program down. scenarios --mode bench hands a
      # token between pairs of threads as fast as it can: two context switches, each with a call
      # stack, per hand-over, about the worst case. Reported, not enforced.
      - name: Overhead (bench)
        shell: pwsh
        run: |
          function Bench([string[]]$Waitwhy) {
            $out = Join-Path $PWD ("bench-" + [guid]::NewGuid() + ".txt")
            $p = Start-Process -FilePath (Resolve-Path .\scenarios.exe) -PassThru -NoNewWindow -RedirectStandardOutput $out `
              -ArgumentList @('--mode', 'bench', '--seconds', '10')
            $null = $p.Handle
            if ($Waitwhy) { & .\waitwhy.exe @Waitwhy --pid $p.Id --seconds 9 *> $null }
            $p.WaitForExit()
            $text = Get-Content $out -Raw
            if ($text -notmatch '(\d+) hand-overs per second') { throw "bench printed: $text" }
            return [double]$Matches[1]
          }
          $alone = Bench @()
          $watched = Bench @('watch')
          $recorded = Bench @('record', '--out', 'bench.etl')
          $alone2 = Bench @()
          $base = ($alone + $alone2) / 2
          $rows = @(
            @('alone (mean of 2 runs)', $base),
            @('waitwhy watch', $watched),
            @('waitwhy record', $recorded))
          $summary = "| bench (worst case) | hand-overs/s | slowdown |`n|---|---|---|`n"
          foreach ($r in $rows) {
            $slow = if ($base -gt 0) { 100 * (1 - $r[1] / $base) } else { 0 }
            $summary += "| $($r[0]) | $([math]::Round($r[1])) | $([math]::Round($slow))% |`n"
            if ($r[0] -ne 'alone (mean of 2 runs)' -and $slow -gt 50) {
              Write-Host "::warning::$($r[0]) slowed the bench by $([math]::Round($slow))% (over 50%)."
            }
          }
          $summary += "`nThe two runs alone: $([math]::Round($alone)) and $([math]::Round($alone2)) hand-overs/s.`n"
          Write-Host $summary
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # The smoke runs' event dumps (version 2, W18) and reports, for turning into test fixtures.
      - name: Keep the smoke-test dumps and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-dumps
          path: |
            buggy-events.txt
            buggy-report.txt
            fixed-events.txt
            fixed-report.txt
            exited-events.txt
            exited-report.txt
            symbols-events.txt
            symbols-report.txt
            launch-events.txt
            launch-report.txt
            buggy-chrome.json
            buggy-speedscope.json
            buggy.html
            etl-report.txt
            ring-report.txt
            buggy.etl.waitwhy
          if-no-files-found: ignore

  # The analysis core (analysis.h) makes no Windows calls (D7), so its tests also run here, with
  # GCC and Clang and every warning as an error.
  analysis-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the analysis tests (GCC and Clang)
        run: |
          set -e
          for cxx in g++ clang++; do
            echo "::group::$cxx"
            $cxx -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror tests/analysis_tests.cpp -o analysis_tests
            ./analysis_tests
            $cxx -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror tests/golden_tests.cpp -o golden_tests
            ./golden_tests tests/golden
            $cxx -std=c++17 -O2 -Wall -Wextra -Wshadow -Werror tests/replay_events.cpp -o replay_events
            ./replay_events docs/traces/buggy-64mb-events.txt
            echo "::endgroup::"
          done

  # W46 (D12): the portable code under AddressSanitizer and UndefinedBehaviorSanitizer, and
  # libFuzzer on the readers of files that come from other machines (dumps, JSON reports).
  # These tools run in CI only; nothing of them is linked into waitwhy.
  sanitizers-and-fuzzing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanitizer and fuzzer runtimes
        run: |
          echo 'int main() { return 0; }' > probe.cpp
          if ! clang++ -fsanitize=address,undefined probe.cpp -o probe 2>/dev/null ||
             ! clang++ -fsanitize=fuzzer-no-link probe.cpp -o probe 2>/dev/null; then
            major=$(clang++ --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
            sudo apt-get update -q && sudo apt-get install -y -q "libclang-rt-${major}-dev"
          fi
          clang++ --version | head -1

      - name: Tests under ASan and UBSan
        run: |
          set -e
          flags="-std=c++17 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          clang++ $flags tests/analysis_tests.cpp -o analysis_tests && ./analysis_tests
          clang++ $flags tests/golden_tests.cpp -o golden_tests && ./golden_tests tests/golden
          clang++ $flags tests/replay_events.cpp -o replay_events && ./replay_events docs/traces/buggy-64mb-events.txt

      - name: Fuzz the dump and JSON readers (60 s each)
        run: |
          set -e
          flags="-std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all"
          clang++ $flags tests/fuzz_dump.cpp -o fuzz_dump
          clang++ $flags tests/fuzz_json.cpp -o fuzz_json
          mkdir -p corpus-dump corpus-json
          cp tests/golden/*.events.txt corpus-dump/
          head -c 60000 docs/traces/buggy-64mb-events.txt > corpus-dump/recorded-start.txt
          cp tests/golden/*.report.json corpus-json/
          ./fuzz_dump -max_total_time=60 -max_len=65536 -timeout=10 -rss_limit_mb=2048 corpus-dump
          ./fuzz_json -max_total_time=60 -max_len=65536 -timeout=10 -rss_limit_mb=2048 corpus-json

      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
            slow-unit-*
          if-no-files-found: ignore
